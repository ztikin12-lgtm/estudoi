<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Foco ENEM — Cronograma até 10/11</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#17213a;--txt:#eef3ff;--muted:#9aaccc;--line:#283653;--accent:#7dd3fc;--accent2:#86efac;--warn:#fde68a;--danger:#fca5a5;--shadow:0 12px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#08111f,#0b1020 45%,#0a1020);color:var(--txt)}
button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:rgba(8,14,28,.92);backdrop-filter:blur(12px)}
.brand{font-weight:900;font-size:22px;letter-spacing:.3px}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}.nav{display:grid;gap:8px;margin-top:28px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--txt)}
.sidebar .tip{position:absolute;left:18px;right:18px;bottom:20px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:12px;color:var(--muted)}
main{padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.topbar h1{font-size:26px;margin:0}.topbar p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:10px 13px;border-radius:11px;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.primary{background:#0ea5e9;border-color:#0ea5e9;color:white;font-weight:800}.btn.good{background:#16a34a;border-color:#16a34a;color:white}.btn.ghost{background:transparent}.btn.danger{background:#7f1d1d;border-color:#991b1b}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(23,33,58,.98),rgba(17,25,45,.98));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.metric{padding:17px}.metric .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric .num{font-size:28px;font-weight:900;margin-top:5px}.metric .sub{font-size:12px;color:var(--muted);margin-top:2px}
.section{display:none}.section.active{display:block}.section-title{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:26px 0 12px}.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--muted);font-size:13px}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}
.panel{padding:18px}.phase{padding:14px 16px;border-left:4px solid var(--accent);margin-bottom:10px;background:rgba(125,211,252,.05);border-radius:12px}.phase strong{display:block}.phase small{color:var(--muted)}
.progress-row{display:grid;grid-template-columns:180px 1fr 72px;gap:10px;align-items:center;margin:11px 0}.bar{height:10px;border-radius:999px;background:#22304c;overflow:hidden}.bar > i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);border-radius:999px}
.calendar-wrap{overflow:auto;padding-bottom:8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:10px;min-width:1500px}.day{border:1px solid var(--line);border-radius:16px;background:rgba(18,26,46,.9);min-height:250px;padding:10px}.day.today{outline:2px solid #38bdf8}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.day-head strong{font-size:13px}.day-head span{font-size:11px;color:var(--muted)}.task{padding:10px;border:1px solid #34445f;background:#18243d;border-radius:12px;margin:8px 0;cursor:grab}.task.done{opacity:.55}.task.done .task-title{text-decoration:line-through}.task .tag{display:inline-flex;font-size:10px;padding:3px 7px;border-radius:999px;background:#243657;color:#b9d2ff;margin-bottom:6px}.task-title{font-size:13px;font-weight:800}.task-meta{font-size:11px;color:var(--muted);margin-top:5px}.task-score{display:flex;gap:6px;margin-top:8px}.task-score input{width:56px;background:#0d1528;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px}.task-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.mini{font-size:11px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#111c33;color:var(--txt);cursor:pointer}.mini.obs{border-color:#6b5d2d;background:#251f11;color:#fde68a}.mini.obs.has-note{background:#4a3b0f;border-color:#a18422;color:#fff3b0}.task-observation{margin-top:9px;padding:8px 9px;border-left:3px solid #facc15;border-radius:8px;background:rgba(250,204,21,.08);font-size:11px;line-height:1.35;color:#fef3c7;white-space:pre-wrap;word-break:break-word}.task-observation strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#fde68a;margin-bottom:3px}
.week-nav{display:flex;align-items:center;gap:8px}.week-label{font-weight:800;min-width:160px;text-align:center}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{background:#0f1830;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#223453}.low{color:#fecaca}.mid{color:#fde68a}.high{color:#bbf7d0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0d1528;color:var(--txt);border-radius:10px;padding:10px}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}
dialog{border:1px solid var(--line);border-radius:18px;background:#10182b;color:var(--txt);width:min(680px,92vw);box-shadow:var(--shadow);padding:0}dialog::backdrop{background:rgba(0,0,0,.68)}.dialog-head{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.dialog-body{padding:18px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.callout{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#0f1730;color:#cbd7ef;font-size:13px}.kicker{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.empty{color:var(--muted);padding:18px;text-align:center}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}.sidebar .tip{display:none}.grid4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.progress-row{grid-template-columns:130px 1fr 58px}}
@media(max-width:600px){main{padding:18px}.grid4{grid-template-columns:1fr 1fr}.nav{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.calendar{min-width:1320px}.metric .num{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">FOCO ENEM <small>Domínio de questões médias até 10/11</small></div>
    <div class="nav">
      <button data-view="painel" class="active">Painel</button>
      <button data-view="cronograma">Cronograma</button>
      <button data-view="progresso">Progresso</button>
      <button data-view="erros">Caderno de erros</button>
      <button data-view="metodo">Método</button>
    </div>
    <div class="tip"><strong>Regra do projeto</strong><br>20% explicar · 60% resolver · 20% corrigir/revisar.</div>
  </aside>
  <main id="appMain"></main>
</div>
<script>
const STORAGE_KEY='foco-enem-v3';
const START='2026-10-08';
const END='2026-11-10';
const phases=[
  {start:'2026-10-08',end:'2026-10-17',name:'Fechar lacunas',desc:'Microaula curta + questões médias direcionadas + correção.'},
  {start:'2026-10-18',end:'2026-10-27',name:'Segunda camada',desc:'Entram novos conteúdos e começam listas mais misturadas.'},
  {start:'2026-10-28',end:'2026-11-04',name:'Desempenho',desc:'Blocos mistos cronometrados; pouca teoria, muita execução.'},
  {start:'2026-11-05',end:'2026-11-07',name:'Reincidências',desc:'Tempo concentrado nos conteúdos com menor taxa de acerto.'},
  {start:'2026-11-08',end:'2026-11-10',name:'Consolidação',desc:'Caderno de erros, fórmulas, padrões e questões médias já erradas.'}
];
const priorities={MAT:['Geometria','Razão / proporção / porcentagem','Funções e modelagem','Estatística e gráficos','Probabilidade e combinatória','Sequências / PA / PG','Trigonometria'],CN:['Mecânica / dinâmica','Estequiometria / soluções','Eletrodinâmica','Química orgânica','Genética / biotecnologia','Ecologia','Termologia','Ondulatória / óptica']};
const subjectRules={
'Geometria':'Desenhar sempre; identificar figura, grandezas e relação antes da conta.',
'Razão / proporção / porcentagem':'Perguntar: 100% corresponde a quê? Qual grandeza depende de qual?',
'Funções e modelagem':'Treinar texto → variável → equação/função → gráfico.',
'Estatística e gráficos':'Antes da conta: variável, unidade, eixo, frequência e o que é pedido.',
'Probabilidade e combinatória':'Perguntar: ordem importa? há repetição? complementar simplifica?',
'Mecânica / dinâmica':'Desenhar o sistema; forças, aceleração e energia antes da fórmula.',
'Estequiometria / soluções':'massa → mol → proporção → mol → massa/volume/concentração.',
'Eletrodinâmica':'Redesenhar circuito; série/paralelo; depois U=Ri e potência.',
'Química orgânica':'função → propriedade → interação → reação.',
'Genética / biotecnologia':'DNA → RNA → proteína → fenótipo; explicar processos causalmente.',
'Ecologia':'Construir cadeias de causa e consequência.',
'Termologia':'Explicar o fenômeno fisicamente antes da fórmula.',
'Ondulatória / óptica':'Identificar o que muda e o que permanece constante no fenômeno.'
};
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function d(s){return new Date(s+'T12:00:00')}
function iso(dt){return dt.toISOString().slice(0,10)}
function addDays(s,n){const x=d(s);x.setDate(x.getDate()+n);return iso(x)}
function phaseFor(date){return phases.find(p=>date>=p.start&&date<=p.end)}
function formatDate(s){return d(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}
function weekday(s){return d(s).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','').toUpperCase()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initialTasks(){
  const pairs=[
    ['Geometria','Mecânica / dinâmica'],['Razão / proporção / porcentagem','Estequiometria / soluções'],['Funções e modelagem','Eletrodinâmica'],['Estatística e gráficos','Química orgânica'],['Geometria','Genética / biotecnologia'],['Razão / proporção / porcentagem','Mecânica / dinâmica'],['Funções e modelagem','Estequiometria / soluções'],['Estatística e gráficos','Eletrodinâmica'],['Probabilidade e combinatória','Química orgânica'],['Geometria','Genética / biotecnologia']
  ];
  const second=[['Probabilidade e combinatória','Ecologia'],['Sequências / PA / PG','Termologia'],['Trigonometria','Ondulatória / óptica'],['Geometria','Química orgânica'],['Funções e modelagem','Genética / biotecnologia'],['Estatística e gráficos','Ecologia'],['Razão / proporção / porcentagem','Termologia'],['Probabilidade e combinatória','Eletrodinâmica'],['Geometria','Mecânica / dinâmica'],['Funções e modelagem','Estequiometria / soluções']];
  let arr=[];
  function push(date,area,content,time='08:00',mode='Microaula 20 min sem consulta + 12–15 questões médias + correção'){
    arr.push({id:uid(),date,area,content,time,duration:80,mode,done:false,hits:'',misses:'',note:''});
  }
  pairs.forEach((x,i)=>{let date=addDays('2026-10-08',i);push(date,'MAT',x[0],'08:00');push(date,'CN',x[1],'13:30')});
  second.forEach((x,i)=>{let date=addDays('2026-10-18',i);push(date,'MAT',x[0],'08:00','15 min de explicação + questões médias, metade misturada + correção');push(date,'CN',x[1],'13:30','15 min de explicação + questões médias, metade misturada + correção')});
  for(let i=0;i<8;i++){let date=addDays('2026-10-28',i);push(date,'MISTO','Bloco misto cronometrado',i%2?'13:30':'08:00','20 MAT + 20 CN, priorizando questões médias; classificar cada erro');}
  ['2026-11-05','2026-11-06','2026-11-07'].forEach((date,i)=>push(date,'ADAPTATIVO','2 conteúdos com menor desempenho','08:00','Escolher pelos dados do painel; 20–30 questões + correção focada'));
  ['2026-11-08','2026-11-09','2026-11-10'].forEach((date,i)=>push(date,'REVISÃO',i===0?'Caderno de erros + fórmulas':i===1?'Questões médias já erradas':'Revisão leve + padrões essenciais','08:00',i===2?'Sem conteúdo novo. Revisar padrões e manter confiança.':'Revisar sem maratona; refazer e explicar erros recorrentes.'));
  return arr;
}
function initialState(){return {tasks:initialTasks(),errors:[],weekStart:'2026-10-08',view:'painel'}}
let state=load();
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&Array.isArray(x.tasks))return x}catch(e){}return initialState()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function stats(){
 const done=state.tasks.filter(t=>t.done).length,total=state.tasks.length;
 let h=0,m=0;state.tasks.forEach(t=>{h+=Number(t.hits)||0;m+=Number(t.misses)||0});
 return {done,total,progress:total?Math.round(done/total*100):0,h,m,acc:h+m?Math.round(h/(h+m)*100):0}
}
function contentStats(){
 const map={};state.tasks.forEach(t=>{if(['MISTO','ADAPTATIVO','REVISÃO'].includes(t.area))return;let x=map[t.content]||(map[t.content]={h:0,m:0,s:0});x.h+=Number(t.hits)||0;x.m+=Number(t.misses)||0;x.s++});
 return Object.entries(map).map(([content,x])=>({content,...x,acc:x.h+x.m?Math.round(x.h/(x.h+x.m)*100):null})).sort((a,b)=>(a.acc??-1)-(b.acc??-1));
}
function nav(){return `<div class="topbar"><div><h1>${state.view==='painel'?'Painel de domínio':state.view==='cronograma'?'Cronograma editável':state.view==='progresso'?'Progresso por conteúdo':state.view==='erros'?'Caderno de erros':'Método de estudo'}</h1><p>Meta: transformar conteúdos recorrentes em acertos consistentes de questões médias.</p></div><div class="actions"><button class="btn" onclick="exportData()">Exportar backup</button><button class="btn" onclick="importData()">Importar</button><button class="btn primary" onclick="openTask()">+ Tarefa</button></div></div>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.getElementById('appMain').innerHTML=nav()+({painel:panelView,cronograma:calendarView,progresso:progressView,erros:errorsView,metodo:methodView}[state.view])();attachDnD()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render()});
function panelView(){const s=stats();return `<section class="section active"><div class="grid4"><div class="card metric"><div class="label">Progresso</div><div class="num">${s.progress}%</div><div class="sub">${s.done}/${s.total} blocos concluídos</div></div><div class="card metric"><div class="label">Questões registradas</div><div class="num">${s.h+s.m}</div><div class="sub">acertos + erros</div></div><div class="card metric"><div class="label">Precisão</div><div class="num">${s.acc||'—'}${s.h+s.m?'%':''}</div><div class="sub">referência: 85–90% específica</div></div><div class="card metric"><div class="label">Erros catalogados</div><div class="num">${state.errors.length}</div><div class="sub">conteúdo · interpretação · estratégia · cálculo</div></div></div><div class="split"><div><div class="section-title"><h2>Fases até 10/11</h2></div><div class="card panel">${phases.map(p=>`<div class="phase"><strong>${formatDate(p.start)}–${formatDate(p.end)} · ${p.name}</strong><small>${p.desc}</small></div>`).join('')}</div></div><div><div class="section-title"><h2>Próximos blocos</h2></div><div class="card panel">${state.tasks.filter(t=>!t.done&&t.date>=START).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6).map(t=>`<div class="phase"><strong>${formatDate(t.date)} · ${t.content}</strong><small>${t.area} · ${t.time} · ${t.duration} min</small></div>`).join('')||'<div class="empty">Tudo concluído.</div>'}</div></div></div><div class="section-title"><h2>Prioridade</h2><span>Mais recorrentes e com melhor retorno primeiro</span></div><div class="split"><div class="card panel"><div class="kicker">Matemática</div>${priorities.MAT.map((x,i)=>`<p><strong>${i+1}. ${x}</strong></p>`).join('')}</div><div class="card panel"><div class="kicker">Ciências da Natureza</div>${priorities.CN.map((x,i)=>`<p><strong>${i+1}. ${x}</strong></p>`).join('')}</div></div></section>`}
function calendarView(){return `<section class="section active"><div class="section-title"><div class="week-nav"><button class="btn" onclick="shiftWeek(-7)">←</button><div class="week-label">${formatDate(state.weekStart)} – ${formatDate(addDays(state.weekStart,6))}</div><button class="btn" onclick="shiftWeek(7)">→</button></div><span>Arraste um bloco para outro dia.</span></div><div class="calendar-wrap"><div class="calendar">${Array.from({length:7},(_,i)=>dayHtml(addDays(state.weekStart,i))).join('')}</div></div><div class="callout">✓ Acertos e ✕ erros são salvos automaticamente. Use <strong>+ Observação</strong> para registrar uma anotação particular daquele bloco. Tudo fica neste navegador via localStorage.</div></section>`}
function dayHtml(date){const ts=state.tasks.filter(t=>t.date===date).sort((a,b)=>a.time.localeCompare(b.time));const p=phaseFor(date);return `<div class="day" data-date="${date}"><div class="day-head"><strong>${weekday(date)} ${formatDate(date)}</strong><span>${p?p.name:''}</span></div>${ts.map(taskHtml).join('')}<button class="mini" onclick="openTask(null,'${date}')">+ adicionar</button></div>`}
function taskHtml(t){return `<div class="task ${t.done?'done':''}" draggable="true" data-id="${t.id}"><span class="tag">${esc(t.area)}</span><div class="task-title">${esc(t.time)} · ${esc(t.content)}</div><div class="task-meta">${t.duration} min · ${esc(t.mode)}</div><div class="task-score"><input aria-label="Acertos" title="Acertos" type="number" min="0" placeholder="✓" value="${esc(t.hits)}" onchange="score('${t.id}','hits',this.value)"><input aria-label="Erros" title="Erros" type="number" min="0" placeholder="✕" value="${esc(t.misses)}" onchange="score('${t.id}','misses',this.value)"></div>${t.note?`<div class="task-observation"><strong>Observação</strong>${esc(t.note)}</div>`:''}<div class="task-actions"><button class="mini" onclick="toggleDone('${t.id}')">${t.done?'Reabrir':'Concluir'}</button><button class="mini" onclick="openTask('${t.id}')">Editar</button><button class="mini obs ${t.note?'has-note':''}" onclick="openObservation('${t.id}')">${t.note?'📝 Ver/editar obs.':'＋ Observação'}</button></div></div>`}
function progressView(){const rows=contentStats();return `<section class="section active"><div class="callout">Use a precisão como diagnóstico, não como garantia. Referência: ~85–90% em listas específicas e ~80–85% quando o conteúdo aparece misturado.</div><div class="card panel" style="margin-top:14px">${rows.map(x=>{let a=x.acc??0;return `<div class="progress-row"><div>${esc(x.content)}</div><div class="bar"><i style="width:${a}%"></i></div><div>${x.acc==null?'sem dados':x.acc+'%'}</div></div>`}).join('')}</div></section>`}
function errorsView(){return `<section class="section active"><div class="actions" style="margin-bottom:12px"><button class="btn good" onclick="openError()">+ Registrar erro</button></div><div class="card panel"><table class="table"><thead><tr><th>Data</th><th>Conteúdo</th><th>Tipo</th><th>Observação</th><th></th></tr></thead><tbody>${state.errors.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${formatDate(e.date)}</td><td>${esc(e.content)}</td><td><span class="badge">${esc(e.type)}</span></td><td>${esc(e.note)}</td><td><button class="mini" onclick="deleteError('${e.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum erro registrado.</td></tr>'}</tbody></table></div></section>`}
function methodView(){const all=[...priorities.MAT,...priorities.CN];return `<section class="section active"><div class="split"><div class="card panel"><div class="kicker">Ciclo de domínio</div><h3>1. Explique sem consulta</h3><p>10–25 min. Conceito → mecanismo → relações/fórmulas → interpretação → armadilhas.</p><h3>2. Questões médias direcionadas</h3><p>Faça 12–20 e corrija logo depois. Não transforme a sessão em aula longa.</p><h3>3. Revisão espaçada</h3><p>Reencontre o padrão em aproximadamente 2–3, 7 e 14 dias.</p><h3>4. Questões misturadas</h3><p>O objetivo final é reconhecer a ferramenta sem alguém dizer qual conteúdo está sendo cobrado.</p><h3>5. Cronometrado</h3><p>Na reta final, execute em blocos semelhantes à prova e classifique erros.</p></div><div class="card panel"><div class="kicker">Método por conteúdo</div>${all.map(x=>`<p><strong>${esc(x)}</strong><br><span style="color:var(--muted)">${esc(subjectRules[x]||'Treinar reconhecimento, execução e correção do padrão.')}</span></p>`).join('')}</div></div></section>`}
function shiftWeek(n){let x=addDays(state.weekStart,n);if(x<START)x=START;if(x>END)x=addDays(END,-6);state.weekStart=x;save();render()}
function score(id,k,v){let t=state.tasks.find(t=>t.id===id);if(t)t[k]=v;save()}
function toggleDone(id){let t=state.tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}
function attachDnD(){document.querySelectorAll('.task').forEach(el=>{el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.id))});document.querySelectorAll('.day').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain'),t=state.tasks.find(x=>x.id===id);if(t){t.date=el.dataset.date;save();render()}})})}
function openObservation(id){
 const t=state.tasks.find(x=>x.id===id);if(!t)return;
 const dlg=document.createElement('dialog');dlg.innerHTML=`<div class="dialog-head"><strong>Observação — ${esc(t.content)}</strong><button class="mini" onclick="this.closest('dialog').close()">✕</button></div><div class="dialog-body"><div class="callout" style="margin-bottom:12px">Anote qualquer coisa útil para este bloco: dúvida, padrão de erro, lembrete, subtópico para revisar ou estratégia para a próxima lista.</div><div class="field"><label>Observação</label><textarea id="obsText" placeholder="Ex.: Errei porque confundi área com perímetro. Refazer 5 questões de semelhança amanhã.">${esc(t.note||'')}</textarea></div></div><div class="dialog-foot"><button class="btn ghost" id="clearObs">Apagar observação</button><button class="btn" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn primary" id="saveObs">Salvar</button></div>`;document.body.appendChild(dlg);dlg.showModal();setTimeout(()=>dlg.querySelector('#obsText').focus(),50);
 dlg.querySelector('#saveObs').onclick=()=>{t.note=dlg.querySelector('#obsText').value.trim();save();dlg.close();render()};
 dlg.querySelector('#clearObs').onclick=()=>{if(confirm('Apagar a observação deste bloco?')){t.note='';save();dlg.close();render()}};
 dlg.addEventListener('close',()=>dlg.remove());
}
function openTask(id=null,date=null){let t=id?state.tasks.find(x=>x.id===id):null;const dlg=document.createElement('dialog');dlg.innerHTML=`<div class="dialog-head"><strong>${t?'Editar':'Nova'} tarefa</strong><button class="mini" onclick="this.closest('dialog').close()">✕</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label>Data</label><input id="fDate" type="date" value="${t?t.date:(date||state.weekStart)}"></div><div class="field"><label>Horário</label><input id="fTime" type="time" value="${t?t.time:'08:00'}"></div><div class="field"><label>Área</label><select id="fArea">${['MAT','CN','MISTO','ADAPTATIVO','REVISÃO'].map(x=>`<option ${t&&t.area===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Duração (min)</label><input id="fDuration" type="number" min="10" value="${t?t.duration:80}"></div><div class="field full"><label>Conteúdo</label><input id="fContent" value="${esc(t?t.content:'')}"></div><div class="field full"><label>Estratégia / modo</label><textarea id="fMode">${esc(t?t.mode:'Microaula curta + questões médias + correção')}</textarea></div></div></div><div class="dialog-foot">${t?'<button class="btn danger" id="delTask">Excluir</button>':''}<button class="btn" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn primary" id="saveTask">Salvar</button></div>`;document.body.appendChild(dlg);dlg.showModal();dlg.querySelector('#saveTask').onclick=()=>{const obj={id:t?t.id:uid(),date:dlg.querySelector('#fDate').value,time:dlg.querySelector('#fTime').value,area:dlg.querySelector('#fArea').value,duration:Number(dlg.querySelector('#fDuration').value)||80,content:dlg.querySelector('#fContent').value.trim()||'Estudo',mode:dlg.querySelector('#fMode').value.trim(),done:t?t.done:false,hits:t?t.hits:'',misses:t?t.misses:'',note:t?t.note:''};if(t)Object.assign(t,obj);else state.tasks.push(obj);save();dlg.close();render()};if(t)dlg.querySelector('#delTask').onclick=()=>{if(confirm('Excluir este bloco?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();dlg.close();render()}};dlg.addEventListener('close',()=>dlg.remove())}
function openError(){const dlg=document.createElement('dialog');const contents=[...priorities.MAT,...priorities.CN];dlg.innerHTML=`<div class="dialog-head"><strong>Registrar erro</strong><button class="mini" onclick="this.closest('dialog').close()">✕</button></div><div class="dialog-body"><div class="form-grid"><div class="field"><label>Data</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Tipo</label><select id="eType"><option>Conteúdo</option><option>Interpretação</option><option>Estratégia</option><option>Cálculo</option><option>Distração</option></select></div><div class="field full"><label>Conteúdo</label><input id="eContent" list="contents"><datalist id="contents">${contents.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div class="field full"><label>O que aconteceu / regra para próxima vez</label><textarea id="eNote"></textarea></div></div></div><div class="dialog-foot"><button class="btn" onclick="this.closest('dialog').close()">Cancelar</button><button class="btn primary" id="saveErr">Salvar</button></div>`;document.body.appendChild(dlg);dlg.showModal();dlg.querySelector('#saveErr').onclick=()=>{state.errors.push({id:uid(),date:dlg.querySelector('#eDate').value,type:dlg.querySelector('#eType').value,content:dlg.querySelector('#eContent').value.trim(),note:dlg.querySelector('#eNote').value.trim()});save();dlg.close();render()};dlg.addEventListener('close',()=>dlg.remove())}
function deleteError(id){state.errors=state.errors.filter(x=>x.id!==id);save();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='foco-enem-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tasks)throw 0;state=x;save();render();alert('Backup importado.')}catch(e){alert('Arquivo inválido.')}};r.readAsText(i.files[0])};i.click()}
render();
</script>
</body>
</html>
